<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DaeStudio · dae 控制中心</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="app" class="layout">
    <div id="sidebar-backdrop" class="backdrop hidden"></div>

    <!-- Clean Left Navigation -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-logo-wrap">
          <img class="brand-mark" src="/img/skybyte-s.png" width="34" height="34" alt="" />
        </div>
        <div class="brand-text">
          <div class="brand-name">DaeStudio</div>
          <div class="brand-ver">eBPF 透明代理中心</div>
        </div>
      </div>

      <nav id="nav-list" class="nav">
        <button class="nav-btn active" data-tab="overview">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
          <span>概览与选路</span>
        </button>
        <button class="nav-btn" data-tab="proxies">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8M3.6 15h16.8M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
          <span>节点与订阅</span>
          <span id="badge-nodes" class="nav-badge">0</span>
        </button>
        <button class="nav-btn" data-tab="groups">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          <span>策略组管理</span>
          <span id="badge-groups" class="nav-badge">0</span>
        </button>
        <button class="nav-btn" data-tab="rules">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
          <span>分流规则</span>
          <span id="badge-rules" class="nav-badge">0</span>
        </button>
        <button class="nav-btn" data-tab="system">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>系统与日志</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="foot-row">
          <span class="text-muted">面板版本</span>
          <button id="side-panel-ver" type="button" class="tag tag-primary mono ver-pill-btn" title="点击查看面板版本与检测更新">v1.0.9</button>
        </div>
        <div class="foot-row">
          <span class="text-muted">核心版本</span>
          <span id="side-dae-ver" class="mono foot-val">dae</span>
        </div>
        <div class="foot-row">
          <span class="text-muted">快捷应用</span>
          <span><kbd>⌘S</kbd> / <kbd>Ctrl+S</kbd></span>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="workspace">
      <header class="header">
        <div class="header-left">
          <button id="btn-mobile-menu" class="icon-btn mobile-only" aria-label="Menu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div id="service-pill" class="state-badge online">
            <span class="dot"></span>
            <span id="service-status-text">运行中</span>
          </div>
          <div class="header-rates mono">
            <span class="rate-pill-down">↓ <strong id="top-down-speed">0 B/s</strong></span>
            <span class="sep">·</span>
            <span class="rate-pill-up">↑ <strong id="top-up-speed">0 B/s</strong></span>
          </div>
        </div>

        <div class="header-right">
          <span id="unsaved-indicator" class="dirty-hint hidden">
            <span class="dirty-dot"></span>
            <span>配置已修改，待应用</span>
          </span>
          <button id="btn-theme" class="btn btn-subtle btn-sm" title="切换深浅色外观">☀ 浅色</button>
          <button id="btn-save-apply" class="btn btn-primary btn-sm">保存并应用</button>
        </div>
      </header>

      <div id="apply-status" class="apply-status hidden" role="status" aria-live="polite"></div>
      <main id="view-root" class="page">
        <div class="empty-box">正在加载软路由状态...</div>
      </main>
    </div>
  </div>

  <!-- Modal -->
  <div id="modal-overlay" class="modal-mask hidden">
    <div id="modal-box" class="modal-panel">
      <div class="modal-head">
        <h3 id="modal-title">编辑</h3>
        <button id="modal-close" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <div id="modal-body" class="modal-content"></div>
      <div id="modal-footer" class="modal-foot"></div>
    </div>
  </div>

  <div id="toast-stack" class="toast-wrap"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
