name: Build & Release DaeStudio

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.4"
      - name: Test and security checks
        run: |
          go test -race ./...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: Cross-compile binaries & package installers
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          VER="v1.0.0"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
            VER="$RELEASE_TAG"
          fi
          VERSION="$VER" DEFAULT_REPO="$GH_REPO" make build-all
          DAED_NEXT_VERSION="${VER#v}" sh ./scripts/package_release.sh
          cd dist
          sha256sum daed-next-linux-* daed-next-openwrt-mipsle *.tar.gz *.ipk *.deb *.run > SHA256SUMS
      - name: Check for an existing release
        if: startsWith(github.ref, 'refs/tags/')
        id: release_status
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload GitHub Release Assets
        if: startsWith(github.ref, 'refs/tags/') && steps.release_status.outputs.exists != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/daed-next-linux-amd64
            dist/daed-next-linux-x86_64
            dist/daed-next-linux-386
            dist/daed-next-linux-arm64
            dist/daed-next-openwrt-mipsle
            dist/luci-app-daed-next_*_x86_64.ipk
            dist/luci-app-daed-next_*_x86_32.ipk
            dist/luci-app-daed-next_*_arm64.ipk
            dist/daed-next-installer-x86_32.run
            dist/daed-next-installer-x86_64.run
            dist/daed-next-installer-arm64.run
            dist/daed-next_*_amd64.deb
            dist/daed-next_*_i386.deb
            dist/daed-next_*_arm64.deb
            dist/daed-next-installer-x86_64.tar.gz
            dist/daed-next-installer-amd64.tar.gz
            dist/daed-next-installer-x86_32.tar.gz
            dist/daed-next-installer-arm64.tar.gz
            dist/daed-next-installer-universal.tar.gz
            dist/SHA256SUMS
            LICENSE
            scripts/install.sh
            scripts/uninstall.sh
